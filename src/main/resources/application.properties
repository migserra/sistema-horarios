# ============================================================
# Aplicacao
# ============================================================
spring.application.name=sistema-horarios
server.port=${SERVER_PORT:8080}

# ============================================================
# Banco de dados MySQL
# As variaveis abaixo podem ser definidas no ambiente (.env) ou
# substituidas diretamente neste arquivo para execucao local.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/horarios_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:horarios}
spring.datasource.password=${DB_PASSWORD:horarios123}

# ============================================================
# JPA / Hibernate
# ddl-auto=update cria e atualiza as tabelas automaticamente.
# Em producao, o recomendado e usar migracoes (Flyway/Liquibase).
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# JSON
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ============================================================
# Springdoc / Swagger UI
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ============================================================
# Inicializacao de dados
# O usuario administrador e criado na primeira execucao com a
# senha criptografada via BCrypt.
# ============================================================
app.seed.admin-login=${ADMIN_USERNAME:admin}
app.seed.admin-senha=${ADMIN_PASSWORD:admin123}
app.seed.dados-demo=${SEED_DEMO:true}
