# Perfil utilizado apenas pelos testes automatizados.
# H2 em memoria no modo de compatibilidade com MySQL: os testes
# nao exigem um servidor MySQL instalado.
spring.datasource.url=jdbc:h2:mem:horarios_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.seed.admin-login=admin
app.seed.admin-senha=admin123
app.seed.dados-demo=false
